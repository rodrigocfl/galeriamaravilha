<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeria Maravilha</title>
<meta name="theme-color" content="#69131f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Galeria">
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#69131f;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fdf6ec;padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#69131f;color:#fdf6ec;font:600 16px system-ui,sans-serif;transition:opacity .4s}
  #splash img{width:112px;height:112px;border-radius:26px}
  #splash a{color:#e8cfa9;font-size:14px;display:none}
</style>
</head>
<body>
<iframe id="app" title="Galeria Maravilha" allow="clipboard-write" src="https://script.google.com/macros/s/AKfycbwJODfoqjkSn7OyLsBbVJFPqEalaaoJJc92uIP6AZtWUOjGnxJfIkZE6ZpPVJSIsJicGw/exec"></iframe>
<div id="splash">
  <img src="icon-192.png" alt="">
  <div>Abrindo…</div>
  <a id="direto" href="https://script.google.com/macros/s/AKfycbwJODfoqjkSn7OyLsBbVJFPqEalaaoJJc92uIP6AZtWUOjGnxJfIkZE6ZpPVJSIsJicGw/exec">Demorando? Toque aqui</a>
</div>
<script>
  // Guarda a chave de acesso deste celular, pedida pelo app que roda dentro da página
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data || {};
    try {
      if (d.tipo === 'gm-pedir-chave') e.source.postMessage({ tipo: 'gm-chave', chave: localStorage.getItem('gm_chave') || '' }, e.origin);
      if (d.tipo === 'gm-salvar-chave') { if (d.chave) localStorage.setItem('gm_chave', d.chave); else localStorage.removeItem('gm_chave'); }
    } catch (err) {}
  });
  var s=document.getElementById('splash');
  document.getElementById('app').addEventListener('load',function(){s.style.opacity=0;setTimeout(function(){s.remove()},450);});
  setTimeout(function(){var a=document.getElementById('direto');if(a)a.style.display='block';},12000);
</script>
</body>
</html>
