<style>
  html,body{margin:0;height:100%;background:#3f0b15;overflow:hidden}
  html.pronto,html.pronto body{background:#fffdf9}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#faf5ee;padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #area{position:fixed;left:0;top:0;width:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  #splash{position:fixed;inset:0;top:env(safe-area-inset-top);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 90% at 50% 30%,#7a1a2b 0%,#5e1220 50%,#3f0b15 100%);color:#e9d6b0;font:italic 500 18px Georgia,serif;letter-spacing:.5px;transition:opacity .4s}
  #splash img{width:112px;height:112px;border-radius:26px}
  #splash a{color:#e8cfa9;font:14px system-ui,sans-serif;display:none;position:absolute;bottom:60px}
</style>
</head>
<body>
<iframe id="app" title="Galeria Maravilha" allow="clipboard-write" src="https://script.google.com/macros/s/AKfycbwJODfoqjkSn7OyLsBbVJFPqEalaaoJJc92uIP6AZtWUOjGnxJfIkZE6ZpPVJSIsJicGw/exec"></iframe>
<div id="area"></div>
<div id="splash">
  <a id="direto" href="https://script.google.com/macros/s/AKfycbwJODfoqjkSn7OyLsBbVJFPqEalaaoJJc92uIP6AZtWUOjGnxJfIkZE6ZpPVJSIsJicGw/exec">Demorando? Toque aqui</a>
</div>
<script>
  // Guarda a chave de acesso deste celular, pedida pelo app que roda dentro da página
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data || {};
    try {
      if (d.tipo === 'gm-pedir-chave') e.source.postMessage({ tipo: 'gm-chave', chave: localStorage.getItem('gm_chave') || '' }, e.origin);
      if (d.tipo === 'gm-salvar-chave') { if (d.chave) localStorage.setItem('gm_chave', d.chave); else localStorage.removeItem('gm_chave'); }
      if (d.tipo === 'gm-pedir-area') enviarArea(e.source, e.origin);
      if (d.tipo === 'gm-realinhar') window.scrollTo(0, 0);
      if (d.tipo === 'gm-pronto') document.documentElement.className = 'pronto';
    } catch (err) {}
  });
  // Manda para o app o tamanho da barra de status e da barra de baixo do iPhone
  function enviarArea(alvo, origem) {
    var cs = getComputedStyle(document.getElementById('area'));
    alvo.postMessage({ tipo: 'gm-area', topo: 0, fundo: 0 }, origem);
  }
  // iPhone: depois que o teclado fecha, a página pode ficar rolada e os toques caem fora do lugar
  function alinhar(){ if (window.scrollY || window.scrollX) window.scrollTo(0, 0); }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', function(){ setTimeout(alinhar, 60); }); window.visualViewport.addEventListener('scroll', function(){ setTimeout(alinhar, 60); }); }
  window.addEventListener('scroll', alinhar);
  var s=document.getElementById('splash');
  document.getElementById('app').addEventListener('load',function(){s.style.opacity=0;setTimeout(function(){s.remove()},450);});
  setTimeout(function(){var a=document.getElementById('direto');if(a)a.style.display='block';},12000);
  setTimeout(function(){document.documentElement.className='pronto';},20000);
</script>
</body>
</html>
